# 백엔드 검사. dev 는 리뷰 없이 머지하므로 이 워크플로가 사실상 유일한 안전장치다.
#
# 비밀값이 필요 없다 — 모든 설정에 기본값이 있고(app/core/config.py),
# 테스트는 인메모리 SQLite 와 가짜 OpenAI 클라이언트를 쓴다.
name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# 같은 PR 에 연달아 push 하면 이전 실행은 취소한다
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 로컬 개발 환경과 같은 버전 (pyproject 최소 요구는 3.11)
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 린트
        run: ruff check .

      - name: 포맷 확인
        run: ruff format --check .

      - name: 테스트
        run: pytest -q

      # 모델만 바꾸고 마이그레이션을 안 만들면 여기서 잡힌다.
      # 로컬은 AUTO_CREATE_TABLES=true 라 멀쩡해 보여도 운영에서 깨진다.
      - name: 마이그레이션 검사
        run: |
          alembic upgrade head
          alembic check
