# 프론트엔드 검사. backend.yml 과 같은 역할이다 —
# dev 는 리뷰 없이 머지하므로 이 워크플로가 사실상 유일한 안전장치다.
#
# 비밀값이 필요 없다. 빌드는 API 를 호출하지 않고, VITE_BACKEND_ORIGIN 은
# 개발 서버 프록시용이라 빌드 시점에는 쓰이지 않는다.
name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [dev, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

# 같은 PR 에 연달아 push 하면 이전 실행은 취소한다
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 로컬 개발 환경과 같은 메이저 버전
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci 는 package-lock.json 그대로 설치한다(install 과 달리 lock 을 고치지 않는다)
      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 포맷 확인
        run: npm run format:check

      # build 스크립트가 `tsc -b && vite build` 라 타입 검사까지 함께 돈다.
      # 타입 오류만으로도 빌드가 실패해야 하므로 따로 나누지 않는다.
      - name: 타입 검사 · 빌드
        run: npm run build
